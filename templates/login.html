{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-brand"><span class="brand-mark">SF</span> {{ site_name }}</div>
  <h1>Log in</h1>

  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username or email</label>
    <input id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>

  <p class="auth-switch">Accounts are created by your manager.</p>
</div>
{% endblock %}
