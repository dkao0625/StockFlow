{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-brand"><span class="brand-mark">SF</span> StockFlow</div>
  <h1>Log in</h1>
  <p class="muted">Inventory tracking and damage reporting for your team.</p>

  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>

  <p class="auth-switch">New employee? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
